<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor d'Incidències TAC - Escola</title>
    
    <!-- Biblioteques externes síncrones (Garanteix que no hi hagi pantalles blanques) -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Firebase Clàssic (Compat) - Es carrega de forma immediata i síncrona -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script>
        // Inicialització global de la base de dades
        window.fb = { active: false };
        
        try {
            let firebaseConfig = null;
            if (window.__firebase_config) {
                firebaseConfig = JSON.parse(window.__firebase_config);
            }
            
            if (firebaseConfig && firebaseConfig.apiKey) {
                firebase.initializeApp(firebaseConfig);
                window.fb = {
                    active: true,
                    auth: firebase.auth(),
                    db: firebase.firestore(),
                    appId: window.__app_id || 'escola-tac-manager',
                    initialToken: window.__initial_auth_token
                };
            }
        } catch (e) {
            console.warn("Corrent en mode d'emmagatzematge local.");
        }
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
        body { 
            font-family: 'Inter', sans-serif; 
            -webkit-tap-highlight-color: transparent;
            background-color: #f8fafc;
        }
        .animate-in { 
            animation: fadeIn 0.3s ease-out; 
        }
        @keyframes fadeIn { 
            from { opacity: 0; transform: translateY(10px); } 
            to { opacity: 1; transform: translateY(0); } 
        }
        input[type="file"]::file-selector-button { 
            display: none; 
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Component segur d'icones Lucide
        const Icon = ({ name, size = 24, className = "" }) => (
            <i 
                data-lucide={name.toLowerCase().replace(/([a-z0-9])([A-Z])/g, '$1-$2')} 
                style={{ width: size, height: size, display: 'inline-block' }}
                className={className}
            ></i>
        );

        function App() {
            const [isFirebase, setIsFirebase] = useState(false);
            const [user, setUser] = useState(null);
            const [incidencies, setIncidencies] = useState([]);
            const [view, setView] = useState('list');
            const [loading, setLoading] = useState(true);
            
            // Formulari
            const [docent, setDocent] = useState('');
            const [descripcio, setDescripcio] = useState('');
            const [aula, setAula] = useState('');
            const [prioritat, setPrioritat] = useState('Mitjana');
            const [tipus, setTipus] = useState('Hardware');
            const [imageData, setImageData] = useState(null);
            const [isSubmitting, setIsSubmitting] = useState(false);

            // Estat de la finestra emergent personalitzada (Modal)
            const [modal, setModal] = useState({
                isOpen: false,
                title: '',
                message: '',
                confirmText: 'Confirmar',
                cancelText: 'Cancel·lar',
                showCancel: true,
                onConfirm: null
            });

            const fileInputRef = useRef(null);

            // Tancar modal
            const closeModal = () => {
                setModal(prev => ({ ...prev, isOpen: false }));
            };

            // Forçar renderitzat d'icones Lucide
            useEffect(() => {
                if (window.lucide) window.lucide.createIcons();
            });

            // 1. Inicialització de l'autenticació de Firebase (Estricta)
            useEffect(() => {
                if (window.fb && window.fb.active) {
                    setIsFirebase(true);
                    
                    const initAuth = async () => {
                        try {
                            if (window.fb.initialToken) {
                                await window.fb.auth.signInWithCustomToken(window.fb.initialToken);
                            } else {
                                await window.fb.auth.signInAnonymously();
                            }
                        } catch (err) {
                            console.error("Error d'autenticació, passant a local:", err);
                            setupLocalStorageFallback();
                        }
                    };

                    initAuth();

                    // Escoltar canvis d'estat d'autenticació
                    const unsubscribeAuth = window.fb.auth.onAuthStateChanged((u) => {
                        if (u) {
                            setUser(u);
                        } else {
                            setUser(null);
                        }
                    });

                    return () => unsubscribeAuth();
                } else {
                    setupLocalStorageFallback();
                }
            }, []);

            // 2. Consulta de dades de Firestore protegida per estat d'usuari autenticat (Regla 3)
            useEffect(() => {
                if (!isFirebase || !user) {
                    if (!isFirebase) setupLocalStorageFallback();
                    return;
                }

                // Ruta absoluta estricta (Regla 1) i sense consultes complexes (Regla 2)
                const ref = window.fb.db.collection('artifacts')
                    .doc(window.fb.appId)
                    .collection('public')
                    .doc('data')
                    .collection('incidencies');
                    
                const unsubscribeData = ref.onSnapshot((snapshot) => {
                    const data = [];
                    snapshot.forEach((doc) => {
                        data.push({ id: doc.id, ...doc.data() });
                    });
                    
                    // Ordenació manual a memòria JS (Regla 2)
                    data.sort((a, b) => {
                        const dateA = a.createdAt?.seconds || 0;
                        const dateB = b.createdAt?.seconds || 0;
                        return dateB - dateA;
                    });
                    
                    setIncidencies(data);
                    setLoading(false);
                }, (error) => {
                    console.error("Error carregant Firebase onSnapshot, passant a local:", error);
                    setupLocalStorageFallback();
                });

                return () => unsubscribeData();
            }, [isFirebase, user]);

            const setupLocalStorageFallback = () => {
                setIsFirebase(false);
                try {
                    const localData = localStorage.getItem('escola_incidencies');
                    if (localData) {
                        setIncidencies(JSON.parse(localData));
                    }
                } catch (e) {
                    console.error("Error llegint LocalStorage", e);
                }
                setLoading(false);
            };

            const saveLocalData = (newData) => {
                setIncidencies(newData);
                try {
                    localStorage.setItem('escola_incidencies', JSON.stringify(newData));
                } catch (e) {
                    console.error("Error desant a LocalStorage", e);
                }
            };

            const handleImageCapture = (e) => {
                const file = e.target.files[0];
                if (file) {
                    // Validació del límit de 5MB (5 * 1024 * 1024 bytes)
                    if (file.size > 5 * 1024 * 1024) {
                        setModal({
                            isOpen: true,
                            title: 'Fitxer massa gran ⚠️',
                            message: 'La imatge seleccionada supera el límit de 5MB. Si us plau, puja una imatge més petita.',
                            confirmText: 'D\'acord',
                            showCancel: false,
                            onConfirm: closeModal
                        });
                        return;
                    }

                    const reader = new FileReader();
                    reader.onloadend = () => {
                        const img = new Image();
                        img.src = reader.result;
                        img.onload = () => {
                            // Reduir la mida de la foto per a un emmagatzematge òptim
                            const canvas = document.createElement('canvas');
                            const MAX_WIDTH = 1024; // Augmentat a 1024px per a fotos de major qualitat
                            const scaleSize = MAX_WIDTH / img.width;
                            canvas.width = MAX_WIDTH;
                            canvas.height = img.height * scaleSize;
                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                            setImageData(canvas.toDataURL('image/jpeg', 0.7)); // Compressió òptima
                        };
                    };
                    reader.readAsDataURL(file);
                }
            };

            const exportToCSV = () => {
                if (incidencies.length === 0) return;
                const headers = ["Data", "Docent", "Ubicació", "Tipus", "Prioritat", "Estat", "Descripció"];
                const rows = incidencies.map(item => {
                    let dateStr = '';
                    if (item.createdAt) {
                        if (item.createdAt.toDate) dateStr = item.createdAt.toDate().toLocaleDateString('ca-ES');
                        else if (item.createdAt.seconds) dateStr = new Date(item.createdAt.seconds * 1000).toLocaleDateString('ca-ES');
                        else dateStr = new Date(item.createdAt).toLocaleDateString('ca-ES');
                    }
                    return [
                        dateStr,
                        `"${item.docent || 'Anònim'}"`,
                        `"${item.aula}"`,
                        item.tipus,
                        item.prioritat,
                        item.status,
                        `"${item.descripcio.replace(/"/g, '""')}"`
                    ];
                });
                const csvContent = "\ufeff" + [headers, ...rows].map(e => e.join(",")).join("\n");
                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement("a");
                link.href = url;
                link.download = `incidencies_tac_escola.csv`;
                link.click();
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                if (!descripcio || !aula || !docent) return;
                setIsSubmitting(true);
                
                const novaIncidencia = {
                    docent,
                    descripcio,
                    aula,
                    prioritat,
                    tipus,
                    image: imageData,
                    status: 'pendent',
                    createdAt: isFirebase ? firebase.firestore.Timestamp.now() : new Date().toISOString()
                };

                if (isFirebase && user) {
                    try {
                        const ref = window.fb.db.collection('artifacts')
                            .doc(window.fb.appId)
                            .collection('public')
                            .doc('data')
                            .collection('incidencies');
                        await ref.add({
                            ...novaIncidencia,
                            userId: user.uid
                        });
                    } catch (err) { 
                        console.error("Error desant a Firebase:", err); 
                    }
                } else {
                    const idTemp = 'local_' + Date.now();
                    const updatedList = [{ id: idTemp, ...novaIncidencia }, ...incidencies];
                    saveLocalData(updatedList);
                }

                setDescripcio(''); setAula(''); setDocent(''); setImageData(null);
                setView('list');
                setIsSubmitting(false);
            };

            // Acció d'execució d'eliminació real
            const executeDelete = async (id) => {
                if (isFirebase && user) {
                    try {
                        const ref = window.fb.db.collection('artifacts')
                            .doc(window.fb.appId)
                            .collection('public')
                            .doc('data')
                            .collection('incidencies')
                            .doc(id);
                        await ref.delete();
                    } catch (e) {
                        console.error("Error al esborrar de Firebase:", e);
                    }
                } else {
                    const updated = incidencies.filter(item => item.id !== id);
                    saveLocalData(updated);
                }
            };

            const toggleStatus = async (id, currentStatus) => {
                const newStatus = currentStatus === 'pendent' ? 'resolta' : 'pendent';
                
                if (isFirebase && user) {
                    const ref = window.fb.db.collection('artifacts')
                        .doc(window.fb.appId)
                        .collection('public')
                        .doc('data')
                        .collection('incidencies')
                        .doc(id);
                    await ref.update({ status: newStatus });
                } else {
                    const updated = incidencies.map(item => item.id === id ? { ...item, status: newStatus } : item);
                    saveLocalData(updated);
                }

                // Si es marca com a resolta, demana a l'usuari si vol esborrar-la completament
                if (newStatus === 'resolta') {
                    setModal({
                        isOpen: true,
                        title: 'Incidència Resolta! 🎉',
                        message: 'Vols eliminar per complet aquesta incidència del llistat ara que s\'ha marcat com a resolta?',
                        confirmText: 'Sí, eliminar',
                        cancelText: 'No, conservar',
                        showCancel: true,
                        onConfirm: () => {
                            executeDelete(id);
                            closeModal();
                        }
                    });
                }
            };

            const handleDeleteClick = (id) => {
                setModal({
                    isOpen: true,
                    title: 'Eliminar incidència 🗑️',
                    message: 'Estàs segur que vols eliminar definitivament aquesta incidència? Aquesta acció no es pot desfer.',
                    confirmText: 'Eliminar',
                    cancelText: 'Cancel·lar',
                    showCancel: true,
                    onConfirm: () => {
                        executeDelete(id);
                        closeModal();
                    }
                });
            };

            if (loading) return (
                <div className="flex h-screen items-center justify-center bg-slate-50">
                    <div className="flex flex-col items-center gap-4 text-center">
                        <div className="w-12 h-12 border-4 border-blue-600 border-t-transparent rounded-full animate-spin"></div>
                        <p className="text-slate-500 font-semibold uppercase tracking-wider text-xs">Arrencant Gestor TAC...</p>
                    </div>
                </div>
            );

            return (
                <div className="min-h-screen pb-24 max-w-2xl mx-auto bg-white shadow-2xl relative">
                    {/* Finestra emergent d'interacció segura (Modal) */}
                    {modal.isOpen && (
                        <div className="fixed inset-0 bg-black/60 flex items-center justify-center p-4 z-50 animate-in fade-in duration-200">
                            <div className="bg-white rounded-3xl p-6 max-w-sm w-full shadow-2xl border border-slate-100 animate-in zoom-in-95 duration-200">
                                <h3 className="text-lg font-black text-slate-900 mb-2">{modal.title}</h3>
                                <p className="text-slate-600 text-sm mb-6 leading-relaxed">{modal.message}</p>
                                <div className="flex gap-3 justify-end">
                                    {modal.showCancel && (
                                        <button 
                                            onClick={closeModal} 
                                            className="px-4 py-2.5 rounded-xl text-xs font-bold text-slate-500 hover:bg-slate-100 transition-colors"
                                        >
                                            {modal.cancelText}
                                        </button>
                                    )}
                                    <button 
                                        onClick={modal.onConfirm} 
                                        className="px-5 py-2.5 rounded-xl text-xs font-black text-white bg-blue-600 hover:bg-blue-700 transition-colors shadow-md shadow-blue-100"
                                    >
                                        {modal.confirmText}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Capçalera */}
                    <header className="bg-blue-700 text-white p-5 sticky top-0 z-20 shadow-lg flex justify-between items-center">
                        <div className="flex items-center gap-3">
                            <div className="bg-white/20 p-2 rounded-lg">
                                <Icon name="Settings" size={24} className="text-white" />
                            </div>
                            <div>
                                <h1 className="text-xl font-black tracking-tight uppercase leading-none">Incidències TAC</h1>
                                <span className="text-[9px] font-bold opacity-60 uppercase tracking-wider">{isFirebase ? 'Sincronitzat Online' : 'Desat al dispositiu (Local)'}</span>
                            </div>
                        </div>
                        <button onClick={exportToCSV} className="flex items-center gap-2 bg-blue-600 hover:bg-blue-500 px-4 py-2 rounded-xl text-xs font-bold transition-all active:scale-95 shadow-inner">
                            <Icon name="Download" size={16} /> EXPORTAR
                        </button>
                    </header>

                    <main className="p-4">
                        {view === 'list' ? (
                            <div className="space-y-4 animate-in">
                                <div className="flex justify-between items-end mb-2 px-1">
                                    <h2 className="text-lg font-bold text-slate-800 flex items-center gap-2">
                                        <Icon name="Layers" size={20} className="text-blue-600"/> 
                                        Historial
                                    </h2>
                                    <span className="text-[10px] bg-blue-100 text-blue-700 px-3 py-1 rounded-full font-black uppercase">
                                        {incidencies.length} Registres
                                    </span>
                                </div>
                                
                                {incidencies.length === 0 ? (
                                    <div className="py-24 text-center flex flex-col items-center gap-6">
                                        <div className="bg-slate-100 p-8 rounded-full">
                                            <Icon name="Search" size={48} className="text-slate-300" />
                                        </div>
                                        <p className="text-slate-400 font-bold uppercase text-xs tracking-widest">Cap problema registrat</p>
                                    </div>
                                ) : incidencies.map(item => (
                                    <div key={item.id} className={`bg-white rounded-2xl shadow-sm border border-slate-200 border-l-[6px] p-5 transition-all ${item.status === 'resolta' ? 'border-green-500 opacity-60 grayscale-[0.5]' : 'border-amber-500'}`}>
                                        <div className="flex justify-between gap-4">
                                            <div className="flex-1 min-w-0">
                                                <div className="flex flex-wrap gap-2 mb-3">
                                                    <span className={`text-[10px] font-black px-3 py-1 rounded-lg uppercase ${item.status === 'resolta' ? 'bg-green-100 text-green-700' : 'bg-amber-100 text-amber-700'}`}>
                                                        {item.status}
                                                    </span>
                                                    <span className="text-[10px] font-black px-3 py-1 rounded-lg bg-slate-100 text-slate-600 uppercase">
                                                        {item.prioritat}
                                                    </span>
                                                </div>
                                                <h3 className="font-black text-xl text-slate-800 leading-tight mb-1">{item.aula}</h3>
                                                <div className="flex items-center gap-2 text-blue-600 text-xs font-bold mb-3 italic">
                                                    <Icon name="User" size={14} />
                                                    <span>{item.docent}</span>
                                                </div>
                                                <p className="text-slate-600 text-sm whitespace-pre-wrap leading-relaxed bg-slate-50 p-3 rounded-xl border border-slate-100">{item.descripcio}</p>
                                            </div>
                                            {item.image && (
                                                <div className="shrink-0">
                                                    <img src={item.image} className="w-24 h-24 object-cover rounded-2xl shadow-md border-2 border-white cursor-zoom-in" onClick={() => window.open(item.image)} />
                                                </div>
                                            )}
                                        </div>
                                        <div className="mt-5 flex justify-between items-center border-t border-slate-100 pt-4">
                                            <div className="flex items-center gap-2 text-[10px] text-slate-400 font-black uppercase tracking-tighter">
                                                <Icon name="Calendar" size={14} />
                                                {item.createdAt?.toDate ? item.createdAt.toDate().toLocaleDateString('ca-ES') : new Date(item.createdAt).toLocaleDateString('ca-ES')}
                                            </div>
                                            <div className="flex gap-3">
                                                <button onClick={() => toggleStatus(item.id, item.status)} className={`p-3 rounded-xl transition-all shadow-sm ${item.status === 'resolta' ? 'bg-slate-200 text-slate-500' : 'bg-green-500 text-white hover:bg-green-600 active:scale-90'}`}>
                                                    <Icon name="Check" size={20}/>
                                                </button>
                                                <button onClick={() => handleDeleteClick(item.id)} className="p-3 bg-red-100 text-red-500 rounded-xl hover:bg-red-500 hover:text-white transition-all shadow-sm active:scale-90">
                                                    <Icon name="Trash" size={20}/>
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        ) : (
                            <div className="bg-white rounded-3xl p-2 animate-in mb-8">
                                <div className="flex items-center gap-4 mb-6">
                                    <button onClick={() => setView('list')} className="p-3 bg-slate-100 hover:bg-slate-200 rounded-2xl transition-all active:scale-90">
                                        <Icon name="ChevronLeft" size={24} className="text-slate-600" />
                                    </button>
                                    <h2 className="text-2xl font-black text-slate-800 tracking-tight">Nova Incidència</h2>
                                </div>
                                
                                <form onSubmit={handleSubmit} className="space-y-6 bg-slate-50 p-6 rounded-[2rem] border border-slate-200 shadow-inner">
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                        <div className="space-y-2">
                                            <label className="block text-xs font-black text-slate-500 uppercase tracking-widest ml-2">Nom del Docent</label>
                                            <input type="text" value={docent} onChange={e => setDocent(e.target.value)} placeholder="El teu nom..." className="w-full p-4 rounded-2xl bg-white border border-slate-200 outline-none focus:ring-4 focus:ring-blue-100 transition-all font-semibold" required />
                                        </div>
                                        <div className="space-y-2">
                                            <label className="block text-xs font-black text-slate-500 uppercase tracking-widest ml-2">Espai / Aula</label>
                                            <input type="text" value={aula} onChange={e => setAula(e.target.value)} placeholder="On passa el problema?" className="w-full p-4 rounded-2xl bg-white border border-slate-200 outline-none focus:ring-4 focus:ring-blue-100 transition-all font-semibold" required />
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-2 gap-4">
                                        <div className="space-y-2">
                                            <label className="block text-xs font-black text-slate-500 uppercase tracking-widest ml-2">Gravetat</label>
                                            <select value={prioritat} onChange={e => setPrioritat(e.target.value)} className="w-full p-4 rounded-2xl bg-white border border-slate-200 outline-none focus:ring-4 focus:ring-blue-100 transition-all font-bold appearance-none">
                                                <option>Baixa</option><option>Mitjana</option><option>Alta</option><option>Urgent</option>
                                            </select>
                                        </div>
                                        <div className="space-y-2">
                                            <label className="block text-xs font-black text-slate-500 uppercase tracking-widest ml-2">Tipologia</label>
                                            <select value={tipus} onChange={e => setTipus(e.target.value)} className="w-full p-4 rounded-2xl bg-white border border-slate-200 outline-none focus:ring-4 focus:ring-blue-100 transition-all font-bold appearance-none">
                                                <option>Hardware</option><option>Software</option><option>Wifi / Xarxa</option><option>PDI / Projector</option><option>Altres</option>
                                            </select>
                                        </div>
                                    </div>

                                    <div className="space-y-2">
                                        <label className="text-xs font-black text-slate-500 uppercase tracking-widest ml-2">Què no funciona?</label>
                                        <textarea value={descripcio} onChange={e => setDocent && setDescripcio(e.target.value)} placeholder="Explica detalladament el problema de l'equip..." className="w-full p-4 rounded-3xl bg-white border border-slate-200 h-32 outline-none focus:ring-4 focus:ring-blue-100 transition-all font-medium resize-none" required />
                                    </div>
                                    
                                    <div className="space-y-2">
                                        <label className="block text-xs font-black text-slate-500 uppercase tracking-widest ml-2">Suport visual (màx 5MB)</label>
                                        <div onClick={() => fileInputRef.current.click()} className={`p-6 border-4 border-dashed rounded-[2.5rem] flex flex-col items-center gap-4 cursor-pointer transition-all ${imageData ? 'border-blue-500 bg-blue-50' : 'border-slate-300 bg-white hover:border-slate-400'}`}>
                                            {imageData ? (
                                                <div className="relative w-full group">
                                                    <img src={imageData} className="h-48 w-full object-cover rounded-3xl shadow-xl border-4 border-white" />
                                                </div>
                                            ) : (
                                                <>
                                                    <div className="bg-blue-100 p-5 rounded-full text-blue-600 shadow-inner">
                                                        <Icon name="Camera" size={40} />
                                                    </div>
                                                    <span className="text-sm font-black text-slate-400 uppercase tracking-tight">Fes una foto o tria fitxer</span>
                                                </>
                                            )}
                                            <input type="file" accept="image/*" capture="environment" ref={fileInputRef} onChange={handleImageCapture} className="hidden" />
                                        </div>
                                    </div>

                                    <button type="submit" disabled={isSubmitting} className="w-full p-6 bg-blue-700 hover:bg-blue-800 text-white font-black rounded-[2rem] shadow-2xl active:scale-[0.98] transition-all flex items-center justify-center gap-3 disabled:opacity-50 uppercase tracking-widest">
                                        {isSubmitting ? <div className="w-6 h-6 border-3 border-white border-t-transparent rounded-full animate-spin"></div> : <><Icon name="Send" size={24} /> Registrar Informe</>}
                                    </button>
                                </form>
                            </div>
                        )}
                    </main>

                    {/* Navbar inferior */}
                    <nav className="fixed bottom-6 left-1/2 -translate-x-1/2 w-[90%] max-w-sm bg-slate-900/90 backdrop-blur-xl border border-white/10 p-4 flex justify-around items-center shadow-2xl rounded-[2.5rem] z-30 transition-all">
                        <button onClick={() => setView('list')} className={`flex flex-col items-center gap-1 transition-all ${view === 'list' ? 'text-blue-400 scale-125' : 'text-slate-500 hover:text-slate-300'}`}>
                            <Icon name="LayoutGrid" size={24}/><span className="text-[8px] font-black tracking-widest uppercase">Llistat</span>
                        </button>
                        
                        <button onClick={() => setView(view === 'new' ? 'list' : 'new')} className={`w-14 h-14 rounded-full flex items-center justify-center shadow-lg transition-all ${view === 'new' ? 'bg-white text-slate-900 rotate-45 scale-90' : 'bg-blue-600 text-white scale-110 -translate-y-2'}`}>
                            <Icon name="Plus" size={32} />
                        </button>

                        <button disabled className="flex flex-col items-center gap-1 text-slate-700 cursor-not-allowed opacity-50">
                            <Icon name="MessageSquare" size={24}/><span className="text-[8px] font-black tracking-widest uppercase">Incidència</span>
                        </button>
                    </nav>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
