<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor d'Incidències TAC - Escola</title>
    <!-- Biblioteques externes -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Configuració de Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, updateDoc, doc, deleteDoc, Timestamp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-firestore.js";

        const firebaseConfig = JSON.parse(window.__firebase_config || '{}');
        const appId = window.__app_id || 'escola-tac-manager';
        const initialToken = window.__initial_auth_token;

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Exportació de Firebase al context global per a React
        window.fb = { 
            auth, db, appId, addDoc, collection, onSnapshot, query, 
            updateDoc, doc, deleteDoc, Timestamp, onAuthStateChanged, 
            signInAnonymously, signInWithCustomToken, initialToken 
        };
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body { 
            font-family: 'Inter', sans-serif; 
            -webkit-tap-highlight-color: transparent;
            background-color: #f8fafc;
        }
        .animate-in { 
            animation: fadeIn 0.3s ease-out; 
        }
        @keyframes fadeIn { 
            from { opacity: 0; transform: translateY(10px); } 
            to { opacity: 1; transform: translateY(0); } 
        }
        input[type="file"]::file-selector-button { 
            display: none; 
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        /**
         * Component d'Icona que utilitza Lucide.
         * Requereix cridar lucide.createIcons() després de cada renderitzat.
         */
        const Icon = ({ name, size = 24, className = "" }) => (
            <i 
                data-lucide={name.toLowerCase().replace(/([a-z0-9])([A-Z])/g, '$1-$2')} 
                style={{ width: size, height: size, display: 'inline-block' }}
                className={className}
            ></i>
        );

        function App() {
            // Estats de l'aplicació
            const [user, setUser] = useState(null);
            const [incidencies, setIncidencies] = useState([]);
            const [view, setView] = useState('list');
            const [loading, setLoading] = useState(true);
            
            // Estats del formulari
            const [docent, setDocent] = useState('');
            const [descripcio, setDescripcio] = useState('');
            const [aula, setAula] = useState('');
            const [prioritat, setPrioritat] = useState('Mitjana');
            const [tipus, setTipus] = useState('Hardware');
            const [imageData, setImageData] = useState(null);
            const [isSubmitting, setIsSubmitting] = useState(false);
            
            // Estats de la Intel·ligència Artificial (Gemini)
            const [isAiLoading, setIsAiLoading] = useState(false);
            const [aiSuggestion, setAiSuggestion] = useState({ id: null, text: '' });

            const fileInputRef = useRef(null);

            // Refrescar icones de Lucide quan el DOM canvia
            useEffect(() => {
                if (window.lucide) window.lucide.createIcons();
            });

            // Inicialització de l'autenticació
            useEffect(() => {
                const initAuth = async () => {
                    if (!window.fb) return;
                    try {
                        if (window.fb.initialToken) {
                            await window.fb.signInWithCustomToken(window.fb.auth, window.fb.initialToken);
                        } else {
                            await window.fb.signInAnonymously(window.fb.auth);
                        }
                    } catch (err) { console.error("Auth error:", err); }
                };
                initAuth();
                const unsubscribe = window.fb.onAuthStateChanged(window.fb.auth, (u) => {
                    setUser(u);
                    if (u) setLoading(false);
                });
                return () => unsubscribe();
            }, []);

            // Subscripció a les dades de Firestore
            useEffect(() => {
                if (!user || !window.fb) return;
                const q = window.fb.collection(window.fb.db, 'artifacts', window.fb.appId, 'public', 'data', 'incidencies');
                const unsubscribe = window.fb.onSnapshot(q, (snapshot) => {
                    const data = snapshot.docs.map(doc => ({
                        id: doc.id,
                        ...doc.data()
                    })).sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
                    setIncidencies(data);
                }, (error) => console.error("Error al carregar dades:", error));
                return () => unsubscribe();
            }, [user]);

            /**
             * Funció genèrica per cridar a l'API de Gemini amb backoff exponencial
             */
            const callGemini = async (prompt, systemInstruction) => {
                const apiKey = ""; // La clau s'injecta automàticament a l'entorn de l'app
                let retries = 0;
                const maxRetries = 5;
                
                while (retries < maxRetries) {
                    try {
                        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                contents: [{ parts: [{ text: prompt }] }],
                                systemInstruction: { parts: [{ text: systemInstruction }] }
                            })
                        });
                        const result = await response.json();
                        return result.candidates?.[0]?.content?.parts?.[0]?.text;
                    } catch (err) {
                        retries++;
                        await new Promise(r => setTimeout(r, Math.pow(2, retries) * 1000));
                    }
                }
                throw new Error("No s'ha pogut connectar amb la IA després de diversos intents.");
            };

            /**
             * Utilitza Gemini per millorar la redacció de la incidència
             */
            const refineDescription = async () => {
                if (!descripcio || descripcio.length < 5) return;
                setIsAiLoading(true);
                try {
                    const systemPrompt = "Ets un expert en suport informàtic escolar. Millora les notes de l'usuari i converteix-les en una descripció tècnica clara i professional en català. Sigues breu i directe.";
                    const refined = await callGemini(`Millora aquesta descripció d'incidència: ${descripcio}`, systemPrompt);
                    if (refined) setDescripcio(refined.trim());
                } catch (e) {
                    console.error("AI Error:", e);
                } finally {
                    setIsAiLoading(false);
                }
            };

            /**
             * Genera una possible solució ràpida per a una incidència existent
             */
            const getSolutionSuggestion = async (incidencia) => {
                setAiSuggestion({ id: incidencia.id, text: 'Analitzant el problema...' });
                try {
                    const systemPrompt = "Ets un coordinador TAC. Proposa 3 passos ràpids per intentar solucionar aquest problema abans que vingui el tècnic. Respon en català i de forma molt concisa.";
                    const prompt = `Incidència: ${incidencia.descripcio}. Tipus: ${incidencia.tipus}. Aula: ${incidencia.aula}.`;
                    const solution = await callGemini(prompt, systemPrompt);
                    setAiSuggestion({ id: incidencia.id, text: solution });
                } catch (e) {
                    setAiSuggestion({ id: incidencia.id, text: 'No s\'ha pogut generar el suggeriment.' });
                }
            };

            const handleImageCapture = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onloadend = () => setImageData(reader.result);
                    reader.readAsDataURL(file);
                }
            };

            const exportToCSV = () => {
                if (incidencies.length === 0) return;
                const headers = ["Data", "Docent", "Ubicació", "Tipus", "Prioritat", "Estat", "Descripció"];
                const rows = incidencies.map(item => [
                    item.createdAt?.toDate().toLocaleDateString('ca-ES') || '',
                    `"${item.docent || 'Anònim'}"`,
                    `"${item.aula}"`,
                    item.tipus,
                    item.prioritat,
                    item.status,
                    `"${item.descripcio.replace(/"/g, '""')}"`
                ]);
                const csvContent = "\ufeff" + [headers, ...rows].map(e => e.join(",")).join("\n");
                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement("a");
                link.href = url;
                link.download = `incidencies_tac_escola.csv`;
                link.click();
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                if (!descripcio || !aula || !docent || !user) return;
                setIsSubmitting(true);
                try {
                    await window.fb.addDoc(window.fb.collection(window.fb.db, 'artifacts', window.fb.appId, 'public', 'data', 'incidencies'), {
                        docent, descripcio, aula, prioritat, tipus, image: imageData,
                        status: 'pendent', userId: user.uid, createdAt: window.fb.Timestamp.now()
                    });
                    setDescripcio(''); setAula(''); setDocent(''); setImageData(null);
                    setView('list');
                } catch (err) { console.error(err); }
                finally { setIsSubmitting(false); }
            };

            const toggleStatus = async (id, currentStatus) => {
                const newStatus = currentStatus === 'pendent' ? 'resolta' : 'pendent';
                await window.fb.updateDoc(window.fb.doc(window.fb.db, 'artifacts', window.fb.appId, 'public', 'data', 'incidencies', id), { status: newStatus });
            };

            const deleteIncidencia = async (id) => {
                if (window.confirm('Estàs segur que vols eliminar aquesta incidència?')) {
                    await window.fb.deleteDoc(window.fb.doc(window.fb.db, 'artifacts', window.fb.appId, 'public', 'data', 'incidencies', id));
                }
            };

            if (loading) return (
                <div className="flex h-screen items-center justify-center bg-slate-50">
                    <div className="flex flex-col items-center gap-4 text-center">
                        <div className="w-12 h-12 border-4 border-blue-600 border-t-transparent rounded-full animate-spin"></div>
                        <p className="text-slate-500 font-semibold uppercase tracking-wider">Iniciant Gestor TAC...</p>
                    </div>
                </div>
            );

            return (
                <div className="min-h-screen pb-24 max-w-2xl mx-auto bg-white shadow-2xl relative">
                    {/* Capçalera */}
                    <header className="bg-blue-700 text-white p-5 sticky top-0 z-20 shadow-lg flex justify-between items-center">
                        <div className="flex items-center gap-3">
                            <div className="bg-white/20 p-2 rounded-lg">
                                <Icon name="Settings" size={24} className="text-white" />
                            </div>
                            <h1 className="text-xl font-black tracking-tight uppercase">Incidències TAC</h1>
                        </div>
                        <button onClick={exportToCSV} className="flex items-center gap-2 bg-blue-600 hover:bg-blue-500 px-4 py-2 rounded-xl text-xs font-bold transition-all active:scale-95 shadow-inner">
                            <Icon name="Download" size={16} /> EXPORTAR
                        </button>
                    </header>

                    <main className="p-4">
                        {view === 'list' ? (
                            <div className="space-y-4 animate-in">
                                <div className="flex justify-between items-end mb-2 px-1">
                                    <h2 className="text-lg font-bold text-slate-800 flex items-center gap-2">
                                        <Icon name="Layers" size={20} className="text-blue-600"/> 
                                        Historial
                                    </h2>
                                    <span className="text-[10px] bg-blue-100 text-blue-700 px-3 py-1 rounded-full font-black uppercase">
                                        {incidencies.length} Registres
                                    </span>
                                </div>
                                
                                {incidencies.length === 0 ? (
                                    <div className="py-24 text-center flex flex-col items-center gap-6">
                                        <div className="bg-slate-100 p-8 rounded-full">
                                            <Icon name="SearchX" size={48} className="text-slate-300" />
                                        </div>
                                        <p className="text-slate-400 font-bold uppercase text-sm tracking-widest">Tot en ordre per ara</p>
                                    </div>
                                ) : incidencies.map(item => (
                                    <div key={item.id} className={`bg-white rounded-2xl shadow-sm border border-slate-200 border-l-[6px] p-5 transition-all ${item.status === 'resolta' ? 'border-green-500 opacity-60 grayscale-[0.5]' : 'border-amber-500'}`}>
                                        <div className="flex justify-between gap-4">
                                            <div className="flex-1 min-w-0">
                                                <div className="flex flex-wrap gap-2 mb-3">
                                                    <span className={`text-[10px] font-black px-3 py-1 rounded-lg uppercase ${item.status === 'resolta' ? 'bg-green-100 text-green-700' : 'bg-amber-100 text-amber-700'}`}>
                                                        {item.status}
                                                    </span>
                                                    <span className="text-[10px] font-black px-3 py-1 rounded-lg bg-slate-100 text-slate-600 uppercase">
                                                        {item.prioritat}
                                                    </span>
                                                </div>
                                                <h3 className="font-black text-xl text-slate-800 leading-tight mb-1">{item.aula}</h3>
                                                <div className="flex items-center gap-2 text-blue-600 text-xs font-bold mb-3 italic">
                                                    <Icon name="User" size={14} />
                                                    <span>{item.docent}</span>
                                                </div>
                                                <p className="text-slate-600 text-sm whitespace-pre-wrap leading-relaxed bg-slate-50 p-3 rounded-xl border border-slate-100">{item.descripcio}</p>
                                                
                                                {/* ✨ Secció IA Suggeriment */}
                                                <div className="mt-4">
                                                    {aiSuggestion.id === item.id ? (
                                                        <div className="bg-indigo-50 p-4 rounded-xl border border-indigo-100 text-xs text-indigo-900 animate-in relative overflow-hidden">
                                                            <div className="absolute top-0 right-0 p-2 opacity-10">
                                                                <Icon name="Sparkles" size={40} />
                                                            </div>
                                                            <div className="font-black flex items-center gap-2 mb-2 text-indigo-700 uppercase tracking-tighter">
                                                                <Icon name="Sparkles" size={14} /> Suggeriment IA
                                                            </div>
                                                            <p className="whitespace-pre-wrap font-medium leading-relaxed">{aiSuggestion.text}</p>
                                                        </div>
                                                    ) : (
                                                        <button 
                                                            onClick={() => getSolutionSuggestion(item)}
                                                            className="text-[10px] font-black text-white bg-indigo-600 px-4 py-2 rounded-xl hover:bg-indigo-700 transition-all flex items-center gap-2 shadow-md active:scale-95"
                                                        >
                                                            <Icon name="Zap" size={12} /> QUÈ PUC PROVAR? ✨
                                                        </button>
                                                    )}
                                                </div>
                                            </div>
                                            {item.image && (
                                                <div className="shrink-0">
                                                    <img src={item.image} className="w-24 h-24 object-cover rounded-2xl shadow-md border-2 border-white cursor-zoom-in" onClick={() => window.open(item.image)} />
                                                </div>
                                            )}
                                        </div>
                                        <div className="mt-5 flex justify-between items-center border-t border-slate-100 pt-4">
                                            <div className="flex items-center gap-2 text-[10px] text-slate-400 font-black uppercase tracking-tighter">
                                                <Icon name="Calendar" size={14} />
                                                {item.createdAt?.toDate().toLocaleDateString('ca-ES')}
                                            </div>
                                            <div className="flex gap-3">
                                                <button onClick={() => toggleStatus(item.id, item.status)} className={`p-3 rounded-xl transition-all shadow-sm ${item.status === 'resolta' ? 'bg-slate-200 text-slate-500' : 'bg-green-500 text-white hover:bg-green-600 active:scale-90'}`}>
                                                    <Icon name="Check" size={20}/>
                                                </button>
                                                <button onClick={() => deleteIncidencia(item.id)} className="p-3 bg-red-100 text-red-500 rounded-xl hover:bg-red-500 hover:text-white transition-all shadow-sm active:scale-90">
                                                    <Icon name="Trash" size={20}/>
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        ) : (
                            <div className="bg-white rounded-3xl p-2 animate-in mb-8">
                                <div className="flex items-center gap-4 mb-6">
                                    <button onClick={() => setView('list')} className="p-3 bg-slate-100 hover:bg-slate-200 rounded-2xl transition-all active:scale-90">
                                        <Icon name="ChevronLeft" size={24} className="text-slate-600" />
                                    </button>
                                    <h2 className="text-2xl font-black text-slate-800 tracking-tight">Nova Incidència</h2>
                                </div>
                                
                                <form onSubmit={handleSubmit} className="space-y-6 bg-slate-50 p-6 rounded-[2rem] border border-slate-200 shadow-inner">
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                        <div className="space-y-2">
                                            <label className="block text-xs font-black text-slate-500 uppercase tracking-widest ml-2">Nom del Docent</label>
                                            <input type="text" value={docent} onChange={e => setDocent(e.target.value)} placeholder="El teu nom..." className="w-full p-4 rounded-2xl bg-white border border-slate-200 outline-none focus:ring-4 focus:ring-blue-100 transition-all font-semibold" required />
                                        </div>
                                        <div className="space-y-2">
                                            <label className="block text-xs font-black text-slate-500 uppercase tracking-widest ml-2">Espai / Aula</label>
                                            <input type="text" value={aula} onChange={e => setAula(e.target.value)} placeholder="On passa el problema?" className="w-full p-4 rounded-2xl bg-white border border-slate-200 outline-none focus:ring-4 focus:ring-blue-100 transition-all font-semibold" required />
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-2 gap-4">
                                        <div className="space-y-2">
                                            <label className="block text-xs font-black text-slate-500 uppercase tracking-widest ml-2">Gravetat</label>
                                            <select value={prioritat} onChange={e => setPrioritat(e.target.value)} className="w-full p-4 rounded-2xl bg-white border border-slate-200 outline-none focus:ring-4 focus:ring-blue-100 transition-all font-bold appearance-none">
                                                <option>Baixa</option><option>Mitjana</option><option>Alta</option><option>Urgent</option>
                                            </select>
                                        </div>
                                        <div className="space-y-2">
                                            <label className="block text-xs font-black text-slate-500 uppercase tracking-widest ml-2">Tipologia</label>
                                            <select value={tipus} onChange={e => setTipus(e.target.value)} className="w-full p-4 rounded-2xl bg-white border border-slate-200 outline-none focus:ring-4 focus:ring-blue-100 transition-all font-bold appearance-none">
                                                <option>Hardware</option><option>Software</option><option>Wifi / Xarxa</option><option>PDI / Projector</option><option>Altres</option>
                                            </select>
                                        </div>
                                    </div>

                                    <div className="space-y-2">
                                        <div className="flex justify-between items-center px-2">
                                            <label className="text-xs font-black text-slate-500 uppercase tracking-widest">Què no funciona?</label>
                                            <button 
                                                type="button"
                                                onClick={refineDescription}
                                                disabled={isAiLoading || !descripcio}
                                                className={`text-[10px] font-black px-4 py-2 rounded-xl flex items-center gap-2 transition-all shadow-sm ${isAiLoading ? 'bg-slate-200 text-slate-400' : 'bg-indigo-600 text-white hover:bg-indigo-700 active:scale-95'}`}
                                            >
                                                {isAiLoading ? <div className="w-3 h-3 border-2 border-white border-t-transparent rounded-full animate-spin"></div> : <Icon name="MagicWand" size={12} />}
                                                IA: MILLORA EL TEXT ✨
                                            </button>
                                        </div>
                                        <textarea value={descripcio} onChange={e => setDescripcio(e.target.value)} placeholder="Descripció breu o paraules clau..." className="w-full p-4 rounded-3xl bg-white border border-slate-200 h-32 outline-none focus:ring-4 focus:ring-blue-100 transition-all font-medium resize-none" required />
                                    </div>
                                    
                                    <div className="space-y-2">
                                        <label className="block text-xs font-black text-slate-500 uppercase tracking-widest ml-2">Suport visual</label>
                                        <div onClick={() => fileInputRef.current.click()} className={`p-6 border-4 border-dashed rounded-[2.5rem] flex flex-col items-center gap-4 cursor-pointer transition-all ${imageData ? 'border-blue-500 bg-blue-50' : 'border-slate-300 bg-white hover:border-slate-400'}`}>
                                            {imageData ? (
                                                <div className="relative w-full group">
                                                    <img src={imageData} className="h-48 w-full object-cover rounded-3xl shadow-xl border-4 border-white" />
                                                    <div className="absolute inset-0 bg-blue-600/20 opacity-0 group-hover:opacity-100 flex items-center justify-center rounded-3xl transition-opacity text-white font-black uppercase text-xs">Canviar imatge</div>
                                                </div>
                                            ) : (
                                                <>
                                                    <div className="bg-blue-100 p-5 rounded-full text-blue-600 shadow-inner">
                                                        <Icon name="Camera" size={40} />
                                                    </div>
                                                    <span className="text-sm font-black text-slate-400 uppercase tracking-tight">Fes una foto o tria fitxer</span>
                                                </>
                                            )}
                                            <input type="file" accept="image/*" capture="environment" ref={fileInputRef} onChange={handleImageCapture} className="hidden" />
                                        </div>
                                    </div>

                                    <button type="submit" disabled={isSubmitting} className="w-full p-6 bg-blue-700 hover:bg-blue-800 text-white font-black rounded-[2rem] shadow-2xl active:scale-[0.98] transition-all flex items-center justify-center gap-3 disabled:opacity-50 uppercase tracking-widest">
                                        {isSubmitting ? <div className="w-6 h-6 border-3 border-white border-t-transparent rounded-full animate-spin"></div> : <><Icon name="Send" size={24} /> Registrar Informe</>}
                                    </button>
                                </form>
                            </div>
                        )}
                    </main>

                    {/* Navbar inferior flotant */}
                    <nav className="fixed bottom-6 left-1/2 -translate-x-1/2 w-[90%] max-w-sm bg-slate-900/90 backdrop-blur-xl border border-white/10 p-4 flex justify-around items-center shadow-2xl rounded-[2.5rem] z-30 transition-all">
                        <button onClick={() => setView('list')} className={`flex flex-col items-center gap-1 transition-all ${view === 'list' ? 'text-blue-400 scale-125' : 'text-slate-500 hover:text-slate-300'}`}>
                            <Icon name="LayoutGrid" size={24}/><span className="text-[8px] font-black tracking-widest uppercase">Llistat</span>
                        </button>
                        
                        <button onClick={() => setView(view === 'new' ? 'list' : 'new')} className={`w-14 h-14 rounded-full flex items-center justify-center shadow-lg transition-all ${view === 'new' ? 'bg-white text-slate-900 rotate-45 scale-90' : 'bg-blue-600 text-white scale-110 -translate-y-2'}`}>
                            <Icon name="Plus" size={32} />
                        </button>

                        <button disabled className="flex flex-col items-center gap-1 text-slate-700 cursor-not-allowed opacity-50">
                            <Icon name="MessageSquare" size={24}/><span className="text-[8px] font-black tracking-widest uppercase">Xat IA</span>
                        </button>
                    </nav>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
